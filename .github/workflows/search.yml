name: search
# Transcript search (search/) to GHCR as ghcr.io/de0ch/services-search, tagged sha-<12> and latest (its unit tests run
# inside the image build), then pinned by digest in k8s/search/search.yaml (a commit by this workflow, pushed with the
# deploy key PIN_DEPLOY_KEY; Flux rolls it out). The package is public: the cluster pulls it without a login.
on:
  push:
    branches: [main]
    paths: [search/**, .github/workflows/search.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
concurrency: { group: search, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    outputs: { digest: "${{ steps.push.outputs.digest }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: search
          push: true
          platforms: linux/amd64
          provenance: false
          labels: org.opencontainers.image.source=https://github.com/DE0CH/services
          tags: |
            ghcr.io/de0ch/services-search:${{ steps.tag.outputs.sha }}
            ghcr.io/de0ch/services-search:latest
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/de0ch/services-search
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
  pin:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ssh-key: "${{ secrets.PIN_DEPLOY_KEY }}" }
      - name: pin the new image by digest; never over a newer pin
        env: { DIGEST: "${{ needs.build.outputs.digest }}" }
        run: |
          T="sha-${GITHUB_SHA::12}" F=k8s/search/search.yaml
          git config user.name "services-ci"; git config user.email "ci@services.invalid"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA isn't on main: nothing pinned"; exit 1; }
            git reset -q --hard origin/main
            cur="$(grep -ho "services-search:sha-[0-9a-f]*" $F | head -1 | cut -d- -f3)"
            if [ "$cur" != 000000000000 ] && full="$(git rev-parse -q --verify "$cur^{commit}")" && [ "$full" != "$GITHUB_SHA" ] \
               && git merge-base --is-ancestor "$GITHUB_SHA" "$full"; then echo "main already pins a newer build ($cur)"; exit 0; fi
            sed -i -E "s#ghcr.io/de0ch/services-search:sha-[0-9a-f]{12}(@sha256:[0-9a-f]{64})?#ghcr.io/de0ch/services-search:$T@$DIGEST#g" $F
            git diff --quiet && exit 0
            git commit -qam "search: pin $T [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
